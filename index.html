<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>SOP 管理系统</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶部导航栏 -->
<header class="topbar">
  <div class="topbar-left">
    <div class="logo">📋 SOP 管理系统</div>
  </div>
  <div class="topbar-right">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索 SOP..." />
    </div>
    <button class="btn-icon" id="themeToggle" title="切换主题">🌙</button>
    <button class="btn-primary" id="addSopBtn">+ 新建 SOP</button>
  </div>
</header>

<!-- 统计栏 -->
<div class="stats-bar" id="statsBar">
  <div class="stat-item">
    <span class="stat-label">SOP 总数</span>
    <span class="stat-value" id="totalSops">0</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">总任务</span>
    <span class="stat-value" id="totalTasks">0</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">已完成</span>
    <span class="stat-value completed" id="completedTasks">0</span>
  </div>
  <div class="stat-item">
    <span class="stat-label">完成率</span>
    <span class="stat-value" id="completionRate">0%</span>
  </div>
</div>

<!-- SOP 卡片横向列表区域 -->
<main class="board" id="board">
  <!-- 卡片由 JS 动态生成 -->
</main>

<!-- 空状态 -->
<div class="empty-state" id="emptyState">
  <div class="empty-icon">📭</div>
  <h2>还没有 SOP</h2>
  <p>点击右上角"新建 SOP"开始创建你的标准操作流程</p>
</div>

<!-- 底部分类导航栏 -->
<nav class="bottom-nav" id="bottomNav">
  <button class="nav-item active" data-category="all">
    <span class="nav-icon">📋</span>
    <span class="nav-label">全部</span>
  </button>
  <button class="nav-item" data-category="life">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">生活</span>
  </button>
  <button class="nav-item" data-category="study">
    <span class="nav-icon">📚</span>
    <span class="nav-label">学习</span>
  </button>
  <button class="nav-item" data-category="work">
    <span class="nav-icon">💼</span>
    <span class="nav-label">工作</span>
  </button>
  <button class="nav-item" data-category="other">
    <span class="nav-icon">📦</span>
    <span class="nav-label">其他</span>
  </button>
</nav>

<!-- 编辑模态框 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="sopModal">
    <div class="modal-header">
      <h2 id="modalTitle">新建 SOP</h2>
      <button class="btn-close" id="closeModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>分类</label>
        <div class="category-selector" id="categorySelector">
          <button class="cat-option active" data-cat="life">🏠 生活</button>
          <button class="cat-option" data-cat="study">📚 学习</button>
          <button class="cat-option" data-cat="work">💼 工作</button>
          <button class="cat-option" data-cat="other">📦 其他</button>
        </div>
      </div>
      <div class="form-group">
        <label>大标题</label>
        <input type="text" id="sopTitle" placeholder="例如：每日工作流程" maxlength="50" />
      </div>
      <div class="form-group">
        <label>描述（可选）</label>
        <input type="text" id="sopDesc" placeholder="简要描述这个 SOP" maxlength="100" />
      </div>
      <div class="form-group">
        <label>颜色标签</label>
        <div class="color-picker" id="colorPicker">
          <div class="color-option selected" data-color="blue" style="background:#3b82f6"></div>
          <div class="color-option" data-color="green" style="background:#10b981"></div>
          <div class="color-option" data-color="purple" style="background:#8b5cf6"></div>
          <div class="color-option" data-color="orange" style="background:#f59e0b"></div>
          <div class="color-option" data-color="pink" style="background:#ec4899"></div>
          <div class="color-option" data-color="teal" style="background:#14b8a6"></div>
          <div class="color-option" data-color="red" style="background:#ef4444"></div>
          <div class="color-option" data-color="slate" style="background:#64748b"></div>
        </div>
      </div>
      <div class="form-group">
        <label>小标题与任务</label>
        <div id="sectionsEditor" class="sections-editor">
          <!-- 小标题区域由 JS 动态生成 -->
        </div>
        <button class="btn-secondary" id="addSectionBtn">+ 添加小标题</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="cancelBtn">取消</button>
      <button class="btn-primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<!-- 确认删除模态框 -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal modal-small">
    <div class="modal-header">
      <h2>确认删除</h2>
    </div>
    <div class="modal-body">
      <p id="confirmText">确定要删除这个 SOP 吗？此操作不可撤销。</p>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="confirmCancel">取消</button>
      <button class="btn-danger" id="confirmDelete">删除</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
